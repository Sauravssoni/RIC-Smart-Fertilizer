name: evaluator-gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python release gates
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Dashboard JavaScript syntax
        run: node --check dashboard/app.js
