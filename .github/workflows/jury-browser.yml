name: Jury browser verification
on:
  push:
    branches: [eval/urvara-v15-public-check]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          node tests/jury-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v15-public-production-screenshots
          path: jury-*.png
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
