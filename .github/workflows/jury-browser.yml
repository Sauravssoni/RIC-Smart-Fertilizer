name: Jury browser verification
on:
  push:
    branches: [eval/nov26-public-verification]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: npm install --no-save playwright@1.51.1
      - run: npx playwright install --with-deps chromium
      - run: |
          node tests/jury-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: public-jury-desktop-mobile-screenshots
          path: jury-*.png
